display_information:
  name: Premday Bot
  description: Organize Premday usergroup meetings.
features:
  bot_user:
    display_name: Premday Bot
    always_online: false
  slash_commands:
    - command: /meeting
      description: Organize the next Premday meeting
      usage_hint: "open the meeting scheduler"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - users:read.email
      - channels:read
      - channels:history
      - groups:read
      - im:read
      - mpim:read
      - canvases:read
      - canvases:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
